name: ClaudeTrap - Windows Debug Build (Actions enabled)

on:
  push:
    branches: [claudetrap]
  pull_request:
    branches: [claudetrap]
  workflow_dispatch:

concurrency:
  group: claudetrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on Windows (Debug)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6.0.428

      - name: Verify WPF ICO resources
        shell: powershell
        run: .\scripts\verify-wpf-ico.ps1

      - name: Restore dependencies
        run: dotnet restore .\Bloxstrap\Bloxstrap.csproj

      - name: Build
        run: dotnet build .\Bloxstrap\Bloxstrap.csproj --no-restore -c Debug

      - name: Publish single-file app
        run: dotnet publish .\Bloxstrap\Bloxstrap.csproj -c Debug -r win-x64 --self-contained false -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -o .\artifacts\debug

      - name: Upload ClaudeTrap debug build
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeTrap-Windows-Debug-${{ github.sha }}
          path: .\artifacts\debug\*
          if-no-files-found: error
          retention-days: 14
