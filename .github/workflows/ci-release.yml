name: ClaudeTrap - Windows Release Build

on:
  push:
    branches: [claudetrap]
  pull_request:
    branches: [claudetrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Windows (Release)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6.0.428

      - name: Restore dependencies
        run: dotnet restore .\Bloxstrap\Bloxstrap.csproj

      - name: Build
        run: dotnet build .\Bloxstrap\Bloxstrap.csproj --no-restore -c Release

      - name: Publish single-file app
        run: dotnet publish .\Bloxstrap\Bloxstrap.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_name }} -o .\artifacts\release

      - name: Upload ClaudeTrap release build
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeTrap-Windows-Release-${{ github.sha }}
          path: .\artifacts\release\*
          if-no-files-found: error
          retention-days: 30
