name: ClaudeTrap - Windows Release Build

on:
  push:
    branches: [claudetrap]
    tags: ["v*"]
  pull_request:
    branches: [claudetrap]
  workflow_dispatch:

concurrency:
  group: claudetrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows (Release)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6.0.428

      - name: Determine application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\Bloxstrap\Bloxstrap.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The project version in Bloxstrap.csproj must use MAJOR.MINOR.PATCH."
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tags must use the vMAJOR.MINOR.PATCH format (received '$tag')."
            }
            $version = $Matches.version
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify WPF ICO resources
        shell: pwsh
        run: .\scripts\verify-wpf-ico.ps1

      - name: Restore dependencies
        run: dotnet restore .\Bloxstrap\Bloxstrap.csproj

      - name: Build
        run: dotnet build .\Bloxstrap\Bloxstrap.csproj --no-restore -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.version }}

      - name: Publish single-file app
        run: dotnet publish .\Bloxstrap\Bloxstrap.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.version }} -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -o .\artifacts\release

      - name: Verify published executable
        shell: pwsh
        run: |
          $executable = ".\artifacts\release\ClaudeTrap.exe"
          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "Publish did not produce ClaudeTrap.exe."
          }

      - name: Upload ClaudeTrap release build
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeTrap-Windows-Release-${{ github.sha }}
          path: .\artifacts\release\*
          if-no-files-found: error
          retention-days: 30

      - name: Create draft ClaudeTrap release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ClaudeTrap ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: ./artifacts/release/ClaudeTrap.exe
